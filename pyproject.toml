[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-limit-core"
version = "0.1.0"
description = "Training project for credit limit calculation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "fastapi>=0.141.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]